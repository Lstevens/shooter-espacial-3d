<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Azul</title>
  </head>
  <body>
    <div id="hud">
      <div id="hp-bar">
        <div id="hp-fill"></div>
        <span id="hp-text">20 / 20</span>
      </div>
      <strong id="weapon-label">Pistola</strong>
      <span id="stage-label">Camara 1/5: Hangar · Amenaza baja</span>
      <span id="time">Resistencia: 0:00</span>
      <span id="hint"
        >Click: jugar · WASD: mover · Ratón: mirar · 1/2/3 o rueda: cambiar arma
        · Espacio: saltar · F5: guardar progreso</span
      >
    </div>
    <div id="crosshair"></div>
    <div id="announce"></div>
    <div id="damage-flash"></div>
    <div id="low-health"></div>
    <div id="damage-numbers"></div>
    <div id="gameover">
      <h1 id="gameover-title">OPERADOR CAÍDO</h1>
      <p id="gameover-text"></p>
      <p id="gameover-stats"></p>
      <div class="gameover-actions">
        <button id="restart">Reintentar</button>
        <button id="restart-first">Desde cámara 1</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
